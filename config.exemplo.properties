# Copie este arquivo para "config.properties" (na mesma pasta do programa) e ajuste.
# O config.properties está no .gitignore: NÃO suba a sua apiKey para o GitHub.

# Onde gravar os votos:
#   memoria   -> só na memória (some ao fechar). Bom para testar.
#   arquivo   -> arquivo local em ~/.urna-cidada (funciona sem internet). PADRÃO.
#   firestore -> Firebase Cloud Firestore, com contingência local se a internet cair.
persistencia.modo=arquivo

# Identificação da eleição e da urna. Use um eleicao.id novo para cada oficina:
# os votos ficam em eleicoes/{eleicao.id}/votos no Firestore.
eleicao.id=oficina-2026
urna.id=urna-01

# PIN do mesário para Zerésima e Apuração
mesario.pin=1234

# Firebase (Console do Firebase > Configurações do projeto > Geral)
firebase.projectId=seu-projeto-id
firebase.apiKey=sua-web-api-key

# Também é possível usar variáveis de ambiente, que têm prioridade:
#   PERSISTENCIA_MODO, ELEICAO_ID, FIREBASE_PROJECTID, FIREBASE_APIKEY, MESARIO_PIN
